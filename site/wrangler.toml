name = "ayelang-site"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "ayelang.dev", custom_domain = true },
  { pattern = "www.ayelang.dev", custom_domain = true },
]

[assets]
directory = "./public"

# Writes public/std (the std reference, not committed) before every
# `wrangler deploy` or `wrangler dev`; needs `cargo build --release` first.
[build]
command = "sh build.sh"
