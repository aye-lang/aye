# Full suite on Linux and macOS (docs/plan.md rule 7). The macOS job only
# runs while the repo is public: Actions minutes are free there, and on a
# private repo macOS minutes count ten times.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AYE_WASI_CLANG: /opt/wasi-sdk/bin/clang
      AYE_WASI_SYSROOT: /opt/wasi-sdk/share/wasi-sysroot
      AYE_WASI_RESOURCE_DIR: /opt/wasi-sdk/resource
    steps:
      - uses: actions/checkout@v4
      - run: sudo sh scripts/setup-ubuntu.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release

  macos:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: brew install llvm lld wasi-libc wasi-runtimes sdl2 freetype
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release
