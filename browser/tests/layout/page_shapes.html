<!DOCTYPE html>
<style>
body { margin: 0 }
.wrap { max-width: 300px; margin: 0 auto; padding: 0 10px; box-sizing: border-box; border-radius: 8px; box-shadow: 0 1px 2px rgba(0, 0, 0, .2) }
.bb { box-sizing: border-box; width: 200px; padding: 20px; border: 5px solid }
.contents { display: contents }
.table { display: table; width: 300px }
.row { display: table-row }
.cell { display: table-cell; border: 1px solid }
</style>
<div class="wrap">centered by max-width and auto margins</div>
<div class="bb">border-box: 200 wide</div>
<div><div class="contents"><p>child of contents</p><span>inline child</span></div></div>
<div class="table"><div class="row"><div class="cell">a</div><div class="cell">b</div></div></div>
<div style="display: none"><div style="position: absolute; top: 0">never shown</div><div style="position: fixed">nor this</div></div>
<div style="transform: translate(10px); filter: blur(2px)">transforms and filters are ignored</div>
<details><summary>closed: only the summary</summary><p>hidden until opened</p></details>
<details open><summary>open</summary><p>shown</p></details>
