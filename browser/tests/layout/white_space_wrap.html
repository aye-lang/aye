<!DOCTYPE html>
<style>
body { margin: 0 }
div { width: 120px; border: 1px solid; margin-bottom: 4px }
.nowrap { white-space: nowrap }
.prewrap { white-space: pre-wrap }
.preline { white-space: pre-line }
</style>
<div class="nowrap">This text does not wrap at all.</div>
<div class="prewrap">Kept   spaces
and lines that wrap here.</div>
<div class="preline">Collapsed   spaces
but kept   lines.</div>
<div>Normal text wraps at spaces here.</div>
