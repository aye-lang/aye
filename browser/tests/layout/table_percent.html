<!DOCTYPE html>
<style>
body { margin: 0 }
td { padding: 0 }
.box { width: 400px; height: 20px }
</style>
<!-- Google's search form: 25% columns on both sides of the box make the
     table twice as wide as the box, and <center> centers the table. -->
<center>
<table cellpadding="0" cellspacing="0"><tr>
<td width="25%">&nbsp;</td>
<td align="center" nowrap><div class="box"></div></td>
<td width="25%">x</td>
</tr></table>
</center>
<!-- <center> centers an auto-width table and a block with max-width. -->
<center>
<table cellpadding="0" cellspacing="0"><tr><td><div class="box"></div></td></tr></table>
<div style="max-width: 200px">max-width</div>
<div>an auto-width block keeps its width</div>
</center>
<!-- A percentage column gets its share of a table with a width. -->
<table style="width: 600px" cellpadding="0" cellspacing="0"><tr>
<td width="50%">half</td><td>rest</td><td width="10%">a</td>
</tr></table>
