<!DOCTYPE html>
<html>
<head>
<title>An article</title>
<style>
body { margin: 0; font-size: 14px; line-height: 1.5 }
header { background: #333; color: white; padding: 10px 20px }
header h1 { margin: 0; font-size: 20px }
nav { display: flex; gap: 12px; padding: 4px 20px }
main { max-width: 500px; margin: 0 auto; padding: 0 20px }
article p { margin: 0 0 10px }
aside { border-left: 4px solid; padding-left: 8px; margin: 16px 0 }
footer { text-align: center; font-size: 12px; padding: 8px }
</style>
</head>
<body>
<header><h1>The Ore Times</h1></header>
<nav><a href="/">Home</a><a href="/news">News</a><a href="/about">About us</a></nav>
<main>
  <article>
    <h2>Layout in a few hundred lines</h2>
    <p>Boxes stack in <em>block flow</em>, words fill <strong>lines</strong>, and tables and flex containers share space among their children.</p>
    <aside>An aside with a border on the left.</aside>
    <ul><li>Lists have markers</li><li>Margins collapse</li></ul>
    <table><tr><th>Part</th><th>Lines</th></tr><tr><td>block</td><td>400</td></tr></table>
  </article>
</main>
<footer>Written in Ore</footer>
</body>
</html>
