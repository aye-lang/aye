<!DOCTYPE html>
<style>
body { margin: 0 }
ol { display: flex; list-style: none; margin: 0; padding: 0 }
li:not(:last-child)::after { content: ""; display: inline-block; width: 16px; height: 16px; margin-inline: 4px; background-color: gray; mask-image: url(chevron.svg) }
q::before { content: open-quote }
q::after { content: close-quote }
.note::before { content: "Note: " }
a[title]::after { content: " (" attr(title) ")" }
.clear::after { content: ""; display: block; clear: both }
.float { float: left; width: 50px; height: 50px }
.icon::before { content: "*"; position: absolute; top: 0; right: 0 }
.none::before { content: none }
.plain::before { display: block }
p { margin: 0 }
</style>
<ol><li>Web</li><li>HTML</li><li>details</li></ol>
<p><q>quoted</q> <span class="note">text</span> <a href="x.html" title="more">link</a></p>
<div class="clear"><div class="float"></div>the parent holds its float</div>
<div class="icon" style="position: relative">positioned</div>
<p class="none">no box for content: none</p>
<p class="plain">no box without content</p>
