<!DOCTYPE html>
<!-- CSS 2.1 10.4 table: a replaced box with an intrinsic ratio, width and
     height both auto. Each svg is 200x100 (viewBox 2:1, as wide as its
     200px parent) before min/max. Expected sizes from the table:
      1 none                                                       200x100
      2 w>max (max-w 100)                                          100x50
      3 w>max, min-h 80                                            100x80
      4 w<min (min-w 300)                                          300x150
      5 w<min, max-h 120                                           300x120
      6 h>max (max-h 40)                                           80x40
      7 h>max, min-w 120                                           120x40
      8 h<min (min-h 150)                                          300x150
      9 h<min, max-w 250                                           250x150
     10 w,h>max, width tighter (max-w 100, max-h 80, min-h 60)     100x60
     11 w,h>max, height tighter (max-w 150, max-h 40, min-w 100)   100x40
     12 w,h<min, height tighter (min-w 300, min-h 400, max-w 500)  500x400
     13 w,h<min, width tighter (min-w 400, min-h 150, max-h 250)   400x200
     14 w<min & h>max (min-w 300, max-h 40)                        300x40
     15 w>max & h<min (max-w 100, min-h 150)                       100x150 -->
<style>
body { margin: 0 }
div { width: 200px }
svg { display: block }
</style>
<div><svg viewBox="0 0 2 1"></svg></div>
<div><svg viewBox="0 0 2 1" style="max-width: 100px"></svg></div>
<div><svg viewBox="0 0 2 1" style="max-width: 100px; min-height: 80px"></svg></div>
<div><svg viewBox="0 0 2 1" style="min-width: 300px"></svg></div>
<div><svg viewBox="0 0 2 1" style="min-width: 300px; max-height: 120px"></svg></div>
<div><svg viewBox="0 0 2 1" style="max-height: 40px"></svg></div>
<div><svg viewBox="0 0 2 1" style="max-height: 40px; min-width: 120px"></svg></div>
<div><svg viewBox="0 0 2 1" style="min-height: 150px"></svg></div>
<div><svg viewBox="0 0 2 1" style="min-height: 150px; max-width: 250px"></svg></div>
<div><svg viewBox="0 0 2 1" style="max-width: 100px; max-height: 80px; min-height: 60px"></svg></div>
<div><svg viewBox="0 0 2 1" style="max-width: 150px; max-height: 40px; min-width: 100px"></svg></div>
<div><svg viewBox="0 0 2 1" style="min-width: 300px; min-height: 400px; max-width: 500px"></svg></div>
<div><svg viewBox="0 0 2 1" style="min-width: 400px; min-height: 150px; max-height: 250px"></svg></div>
<div><svg viewBox="0 0 2 1" style="min-width: 300px; max-height: 40px"></svg></div>
<div><svg viewBox="0 0 2 1" style="max-width: 100px; min-height: 150px"></svg></div>
