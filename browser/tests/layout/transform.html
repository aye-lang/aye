<!DOCTYPE html>
<style>
body { margin: 0 }
div { height: 20px }
.t1 { width: 100px; transform: translate(10px, 5px) }
.t2 { width: 200px; transform: translateX(-50%) translateY(100%) }
.t3 { width: 100px; transform: matrix(1, 0, 0, 1, 30, -10) }
.t4 { width: 100px; transform: translateX(calc(100% + 8px)) rotate(0deg) }
.t5 { width: 100px; transform: scale(2); transform-origin: left top }
.inner { width: 40px; margin-left: 10px }
.cb { position: relative; width: 300px; height: 40px; transform: translateY(10px) }
.cb .fixed { position: fixed; top: 0; right: 0; width: 50px }
.drawer { position: fixed; top: 0; right: 0; width: 250px; height: 100%; transform: translateX(100%) }
.bad { width: 100px; transform: translate(10px) frobnicate(3) }
</style>
<div class="t1">moved 10, 5<div class="inner">and its child</div></div>
<div class="t2">left by half its width, down by its height</div>
<div class="t3">matrix</div>
<div class="t4">calc</div>
<div class="t5">scaled: the box stays</div>
<div class="cb">a transformed containing block<div class="fixed">fixed</div></div>
<div class="drawer">an off-canvas drawer</div>
<div class="bad">not moved</div>
<span style="transform: translateX(50px)">inline boxes are not transformed</span>
<div style="width: 100px; transform: rotate(90deg) translate(10px)">quarter turn</div>
<div style="width: 100px; transform: scaleX(-1); transform-origin: 0 0">flipped</div>
<div style="width: 100px; transform: rotate(45deg)">not drawn turned</div>
