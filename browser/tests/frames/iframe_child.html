<p id="msg">Child text</p>
<script>
console.log('child: parent === top', parent === top, '| window === top', window === top, '| name', window.name);
console.log('child: frameElement', frameElement.id, '| parent title', parent.document.title, '| parent.frames[0] === window', parent.frames[0] === window);
