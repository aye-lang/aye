<!DOCTYPE html>
<html><head>
<style>h1 { color: red; margin-top: 5px } p { color: red }</style>
<style>p { color: blue }</style>
</head><body>
<style>p { font-style: italic } h1 { font-weight: normal }</style>

</body></html>
