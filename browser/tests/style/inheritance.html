<!DOCTYPE html>
<style>
body { color: navy; font-family: Georgia, serif; border: 1px solid red; margin: 4px; text-align: center; white-space: pre-line }
.reset { color: initial; text-align: unset }
.inh { border-top-color: inherit; margin-left: inherit; padding: inherit }
.box { padding: 5px }
.cur { color: currentcolor; background-color: currentColor }
.un { margin-top: unset; color: unset }
</style>
<body>
<p>inherits color, font-family, text-align, white-space; not border or margin</p>
<div class="box"><p class="inh">inherit on non-inherited properties</p></div>
<p class="reset">initial and unset</p>
<p class="cur">currentcolor</p>
<p class="un">unset</p>
</body>
