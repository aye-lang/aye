<!DOCTYPE html>
<style>
.f { float: left; clear: both; z-index: -3 }
.g { display: grid; grid-template-columns: [full-start] repeat(2, minmax(10em, 1fr)) 200px [full-end]; grid-template-rows: auto 1fr; grid-template-areas: "head head" "nav main"; grid-gap: 4px 8px }
.a { grid-column: 1 / span 2; grid-row: 2 }
.b { grid-area: main }
.c { grid-area: 1 / 2 / 3; z-index: 2.5; float: up }
.d { grid-column: nav; z-index: auto; grid-row-gap: 3px }
</style>
<div class="f">float</div>
<div class="g"><p class="a">a</p><p class="b">b</p><p class="c">c</p><p class="d">d</p></div>
