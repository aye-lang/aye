<!doctype html>
<title>Base URL</title>
<base target="_self">
<base href="https://example.com/docs/intro/">
<base href="https://example.org/ignored/">
<h1>Base URL</h1>
<p>Relative links resolve against the first base element with an href:
<a href="guide.html">a guide</a>, <a href="../api/">the API</a>,
<a href="/top">the top</a> and <a href="?q=1">a query</a>.</p>
