<!doctype html>
<title>Code viewer</title>
<!-- Shaped like react.dev's code panes: each line of a `pre` is a
     `div` of syntax spans ending with a `br`; the Markdown keeps the
     lines in a fenced block. -->
<main>
<h1>Components</h1>
<pre class="sp-cm sp-javascript"><code class="sp-pre-placeholder"><div class="cm-line"><span class="kw">function</span> <span class="def">Video</span><span class="p">(</span><span class="p">{</span> video <span class="p">}</span><span class="p">)</span> <span class="p">{</span><br></div><div class="cm-line">  <span class="kw">return</span> <span class="p">(</span><br></div><div class="cm-line">    <span class="p">&lt;</span><span class="tag">div</span><span class="p">&gt;</span><br></div><div class="cm-line">      <span class="p">&lt;</span><span class="def">Thumbnail</span> video<span class="p">=</span><span class="p">{</span>video<span class="p">}</span> <span class="p">/&gt;</span><br></div><div class="cm-line">    <span class="p">&lt;/</span><span class="tag">div</span><span class="p">&gt;</span><br></div><div class="cm-line">  <span class="p">);</span><br></div><div class="cm-line"><span class="p">}</span></div></code></pre>
<p>Lines without a <code>br</code>, and a hidden copy button:</p>
<pre class="language-css"><div class="line">a { color: red }</div><div class="line">b { color: blue }</div><button style="display:none">Copy</button></pre>
<pre><span>one</span>
<span>two</span><br><span>three</span></pre>
</main>
