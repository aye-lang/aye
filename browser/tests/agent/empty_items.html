<!doctype html>
<title>Empty list items</title>
<!-- Real pages (Wikipedia's menus) have list items whose content is all
     hidden or empty; the Markdown of such an item is just its marker. -->
<ul>
  <li></li>
  <li><span style="display:none">hidden</span></li>
  <li><p></p>after an empty paragraph</li>
  <li>Last</li>
</ul>
