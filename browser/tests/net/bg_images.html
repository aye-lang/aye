<!doctype html><title>Background images</title>
<p>Four images answered after 0.3 s each load in the background: the
scripts after them run while they load, their load events come in
order before the window's, and a request replaced while it loads never
fires.</p>
<img id="a" src="/slow/paint/img/photo.png?a"><img id="b" src="/slow/paint/img/photo.png?b">
<img id="c" src="/slow/paint/img/photo.png?c"><img id="d" src="/slow/paint/img/photo.png?d">
<img id="e" src="/slow/paint/img/photo.png?e1">
<pre id="log"></pre>
<script>
const lines = [];
function note(s) {
  lines.push(s);
  document.getElementById('log').textContent = lines.join('\n');
}
const imgs = ['a', 'b', 'c', 'd'].map(id => document.getElementById(id));
const e = document.getElementById('e');
for (const img of [...imgs, e]) {
  img.onload = () => note('load ' + img.id + ' ' + img.currentSrc.split('?')[1] + ' ' + img.naturalWidth + 'x' + img.naturalHeight + ' complete=' + img.complete + ' readyState=' + document.readyState);
  img.onerror = () => note('error ' + img.id);
}
note('first script: complete=' + imgs.map(i => i.complete).join());
</script>
<script>
// The requests started at the end of the first script; this one runs
// while they load.
fetch('/slow-now').then(r => r.text()).then(t => note('images in flight during the second script: ' + (+t > 0 ? 'some' : 'none')));
note('second script: complete=' + imgs.map(i => i.complete).join() + ' naturalWidth=' + imgs[0].naturalWidth);
// Replaced while it loads: only the new request's load event fires.
e.src = '/slow/paint/img/photo.png?e2';
addEventListener('DOMContentLoaded', () => note('DOMContentLoaded: complete=' + imgs.map(i => i.complete).join()));
// The window draws while they load: animation frames come before its
// load event (on the virtual clock of a dump, none: time does not pass).
let loaded = false, frames = 0;
requestAnimationFrame(function tick() {
  if (loaded) return;
  frames++;
  requestAnimationFrame(tick);
});
addEventListener('load', () => {
  loaded = true;
  note('window load: ' + [...imgs, e].map(i => i.complete + '/' + i.naturalWidth).join(' '));
  note('animation frames before it: ' + (frames > 2 ? 'several' : frames));
});
</script>
