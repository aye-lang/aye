<!DOCTYPE html>
<style>
body { margin: 10px }
.pie { position: relative; width: 100px; height: 100px; overflow: hidden; border-radius: 50px; border: 1px solid black; background: white; transform: scaleX(-1) rotate(-90deg) }
.wedge { position: absolute; width: 50px; left: 50px; top: 50px; border: solid transparent; border-width: 50px 0 0 120px }
.block { position: absolute; left: 0; top: 0; border-style: solid; border-width: 0 100px 50px 0 }
.tri { width: 0; height: 0; border: 20px solid transparent; border-bottom-color: green; display: inline-block }
.four { width: 20px; height: 20px; border: 15px solid; border-color: red green blue orange; display: inline-block }
.round { width: 60px; height: 60px; overflow: hidden; border-radius: 30px; display: inline-block }
.round div { width: 60px; height: 60px; background: royalblue }
</style>
<div class="pie">
  <div class="wedge" style="border-left-color: gold"></div>
  <div class="block" style="border-color: gold"></div>
  <div class="block" style="border-color: royalblue; border-width: 0 50px 100px 0"></div>
</div>
<span class="tri"></span>
<span class="four"></span>
<span class="round"><div></div></span>
