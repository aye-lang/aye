<!DOCTYPE html>
<title>Backgrounds</title>
<style>
body { margin: 10px; background-color: #eef }
div { height: 30px; margin-bottom: 6px }
.red { background-color: red }
.half { background-color: rgba(0, 128, 0, 0.5); margin-top: -20px; margin-left: 40px }
.pad { background-color: navy; padding: 8px; width: 100px }
.pad p { background-color: yellow; margin: 0; height: 14px }
.clear { background-color: transparent; border: 1px solid black }
</style>
<div class="red"></div>
<div class="half"></div>
<div class="pad"><p></p></div>
<div class="clear"></div>
