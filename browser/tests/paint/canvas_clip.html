<!doctype html><style>body { margin: 10px; background: #fafafa; }</style><canvas id="c" width="360" height="240"></canvas><script>
const x = document.getElementById('c').getContext('2d');
x.save();
x.beginPath();
x.arc(85, 75, 60, 0, Math.PI*2);
x.clip();
const g = x.createLinearGradient(20, 0, 145, 0);
g.addColorStop(0, '#466ddd');
g.addColorStop(1, '#d96b8d');
x.fillStyle = g;
x.fillRect(0, 0, 170, 150);
x.save();
x.beginPath();
x.rect(0, 0, 85, 150);
x.clip();
x.fillStyle = 'rgba(255,255,255,0.6)';
x.fillRect(0, 0, 170, 150);
x.restore();
x.clearRect(70, 60, 30, 30);
x.restore();
x.save();
x.beginPath();
x.rect(190, 15, 145, 120);
x.rect(225, 45, 75, 60);
x.clip('evenodd');
x.fillStyle = '#38ad88';
x.fillRect(170, 0, 190, 150);
x.restore();
x.shadowColor = 'rgba(0,0,0,0.4)';
x.shadowBlur = 10;
x.shadowOffsetX = 5;
x.shadowOffsetY = 5;
x.fillStyle = '#eab54b';
x.fillRect(25, 165, 110, 45);
x.shadowColor = 'transparent';
x.fillStyle = '#466ddd';
x.fillRect(190, 165, 70, 45);
x.globalCompositeOperation = 'destination-out';
x.beginPath();
x.arc(225, 185, 15, 0, Math.PI*2);
x.fill();
</script>
