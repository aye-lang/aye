<style>
body { margin: 8px }
.box { width: 120px; height: 40px; border: 2px solid black; margin-bottom: 12px; background-color: #eee }

.inner { width: 200px; height: 60px; background-color: rgba(255, 0, 0, 0.5) }

<div class="box hidden"><div class="inner">Clipped content runs past the edge of its box</div></div>
