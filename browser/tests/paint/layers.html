<!DOCTYPE html>
<style>
body { margin: 0 }
.a { position: absolute; top: 10px; left: 10px; width: 100px; height: 60px; background: red; z-index: 2 }
.b { position: absolute; top: 30px; left: 40px; width: 100px; height: 60px; background: blue; z-index: 1 }
.neg { position: absolute; z-index: -1; top: 100px; left: 150px; width: 150px; height: 80px; background: yellow }
.flow { background: #ccc; height: 50px; width: 200px; margin: 120px 0 0 120px }
.rel { position: relative; left: 100px; top: -30px; width: 60px; height: 30px; background: green }
.after { width: 60px; height: 30px; background: orange; margin-left: 150px; margin-top: -40px }
.clip { overflow: hidden; position: relative; width: 80px; height: 40px; background: #eee; margin: 10px }
.clip div { position: absolute; top: 20px; left: 40px; width: 100px; height: 100px; background: purple }
.out { overflow: hidden; width: 80px; height: 20px; background: #eee; margin-left: 200px }
.out div { position: absolute; top: 240px; left: 300px; width: 60px; height: 40px; background: teal }
.f { float: right; width: 50px; height: 50px; background: pink }
</style>
<div class="a"></div><div class="b"></div><div class="neg"></div>
<div class="flow"><div class="f"></div>flow text</div>
<div class="rel"></div>
<div class="after"></div>
<div class="clip"><div></div></div>
<div class="out"><div></div></div>
