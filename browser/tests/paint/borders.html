<!DOCTYPE html>
<style>
body { margin: 8px }
div { width: 80px; height: 20px; margin: 0 0 8px 0 }
.solid { border: 3px solid black }
.dashed { border: 2px dashed blue }
.dotted { border: 3px dotted green }
.double { border: 6px double purple }
.sides { border-style: solid; border-width: 1px 4px 8px 2px; border-color: red green blue orange }
.inset { border: 4px inset gray }
.color { color: teal; border: 5px solid }
.partial { border-bottom: 2px solid black }
</style>
<div class="solid"></div>
<div class="dashed"></div>
<div class="dotted"></div>
<div class="double"></div>
<div class="sides"></div>
<div class="inset"></div>
<div class="color"></div>
<div class="partial"></div>
<hr>
