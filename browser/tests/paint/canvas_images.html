<!doctype html><style>body { margin: 10px; background: #fafafa; }</style><img id="image" src="img/photo.png" hidden><canvas id="c" width="360" height="240"></canvas><script>
const src = new OffscreenCanvas(4, 4);
const s = src.getContext('2d');
s.fillStyle = '#466ddd';
s.fillRect(0, 0, 2, 2);
s.fillStyle = '#38ad88';
s.fillRect(2, 0, 2, 2);
s.fillStyle = '#eab54b';
s.fillRect(0, 2, 2, 2);
s.fillStyle = '#d96b8d';
s.fillRect(2, 2, 2, 2);
const x = document.getElementById('c').getContext('2d');
x.drawImage(src, 10, 10, 100, 100);
x.imageSmoothingEnabled = false;
const photo = document.getElementById('image');
photo.decode().then(() => x.drawImage(photo, 130, 10, 100, 100));
x.drawImage(src, 2, 0, 2, 4, 250, 10, 80, 100);
x.save();
x.translate(65, 175);
x.rotate(Math.PI/6);
x.drawImage(src, -35, -35, 70, 70);
x.restore();
x.fillStyle = x.createPattern(src, 'repeat');
x.fillRect(130, 135, 100, 80);
createImageBitmap(src).then(bitmap => x.drawImage(bitmap, 250, 135, 80, 80));
</script>
