<!DOCTYPE html>
<title>DOMParser</title>
<pre id="out"></pre>
<script>
// DOMParser parses a whole document: a script's text that mentions
// <head> or <body> stays text (mistral.ai's Astro router), the html
// element keeps its attributes, and the document has scripts, forms and
// links. Its nodes' ownerDocument is the parsed document until they are
// inserted elsewhere, so importNode makes an upgraded custom element
// (Turbo's frames on GitHub). A fetched Response can be cloned.
function log(...parts) { document.getElementById('out').textContent += parts.join(' ') + '\n'; }
customElements.define('x-frame', class extends HTMLElement {});
const src = '<!DOCTYPE html><html lang="en" data-x="1"><head><title>Parsed</title>' +
  '<script>/* swaps <head> and <body> on navigation */<\/script></head>' +
  '<body class="b"><form></form><a href="/n">n</a><x-frame id="f"></x-frame><p>end</p></body></html>';
const doc = new DOMParser().parseFromString(src, 'text/html');
log('title', doc.title, doc.documentElement.getAttribute('lang'), doc.documentElement.getAttribute('data-x'));
log('head', doc.head.children.length, doc.head.querySelector('script').textContent);
log('body', doc.body.className, Array.from(doc.body.children, c => c.localName).join(','));
log('collections', doc.scripts.length, doc.forms.length, doc.links.length, doc.images.length);
const frame = doc.body.querySelector('x-frame');
const X = customElements.get('x-frame');
log('owner', frame.ownerDocument === doc, doc.documentElement.ownerDocument === doc, frame.ownerDocument !== document);
log('upgraded', frame instanceof X, document.importNode(frame, true) instanceof X);
const p = doc.body.querySelector('p');
document.body.appendChild(p);
log('moved', p.ownerDocument === document);
// Node document changes only by adoption: a removed node keeps the parsed
// document; importNode clones and adoptNode take the adopting document's.
const q = doc.body.querySelector('a');
q.remove();
log('removed', q.ownerDocument === doc, q.ownerDocument !== document);
const q2 = doc.createElement('b');
q2.appendChild(doc.createTextNode('t'));
log('created', q2.ownerDocument === doc, q2.firstChild.ownerDocument === doc, doc.createElement('i').ownerDocument === doc);
document.body.appendChild(q);
log('inserted', q.ownerDocument === document);
q.remove();
log('kept', q.ownerDocument === document);
const q3 = document.adoptNode(q2);
log('adopt', q3 === q2, q2.ownerDocument === document, q2.firstChild.ownerDocument === document);
const q4 = doc.importNode(document.createElement('u'), true);
log('import', q4.ownerDocument === doc, document.importNode(q4, true).ownerDocument === document);
const q5 = document.createElement('s');
doc.adoptNode(q5);
log('adopted', q5.ownerDocument === doc, doc.createElement('s').ownerDocument === doc);
const sub = doc.createElement('div');
sub.innerHTML = '<section><span id="gc">x</span></section>';
const gc = sub.querySelector('#gc');
log('sub-before', gc.ownerDocument === doc);
document.body.appendChild(sub);
log('sub-in', gc.ownerDocument === document, sub.firstChild.ownerDocument === document);
sub.remove();
log('sub-out', gc.ownerDocument === document, sub.ownerDocument === document);
log('doc', doc.ownerDocument, document.ownerDocument);
fetch('scripts/items.json').then(async r => {
  const c = r.clone();
  log('clone', c instanceof Response, c.status, c.ok, c.url === r.url, c.headers.get('content-type'), (await c.text()) === (await r.text()));
  try { r.clone(); } catch (e) { log('used', e.name); }
});
</script>
