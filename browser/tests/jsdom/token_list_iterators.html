<!doctype html>
<title>DOMTokenList iterators</title>
<p id="out" class="a b">pending</p>
<script>
// The Mistral blog's class helpers call classList.values().
const l = document.getElementById('out').classList;
document.getElementById('out').textContent = [
  [...l.values()].join(','), [...l.keys()].join(','), [...l.entries()].join(';'), [...l].join(','),
].join(' ');
</script>
